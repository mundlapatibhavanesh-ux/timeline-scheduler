<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Work Scheduler</title>
    <style>
        :root {
            --bright-black: #1a1a1a;
            --accent-blue: #007bff;
            --accent-green: #28a745;
            --bg-color: #f4f6f9;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            background-color: var(--bg-color);
            color: #333;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .cal-btn {
            background-color: var(--bright-black);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .cal-btn:hover {
            background-color: #333;
            box-shadow: 0 0 15px rgba(255,255,255,0.2), 0 0 12px var(--accent-blue);
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            text-align: left;
        }
        .view-selectors {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .view-selectors button {
            flex: 1;
            padding: 8px;
            font-size: 0.85rem;
            background: #e9ecef;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .view-selectors button.active {
            background: var(--accent-blue);
            color: white;
        }
        .picker-container {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            justify-content: center;
        }
        .time-scroll-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .time-scroll-box label {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        select {
            padding: 10px;
            font-size: 1.1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            width: 80px;
            text-align: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        button.btn-main {
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--accent-blue);
            color: white;
            margin-bottom: 10px;
        }
        button.btn-start-timeline {
            background-color: var(--accent-green);
            color: white;
            display: none; /* Only shows when a task is waiting to start */
        }
        button.btn-stop {
            background-color: #dc3545;
            color: white;
            display: none;
            padding: 15px;
            font-size: 1.3rem;
            margin-top: 15px;
            width: 100%;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        #current-timer-box {
            background: #e9ecef;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 1.2rem;
            text-align: center;
        }
        #task-list {
            list-style: none;
            padding: 0;
            text-align: left;
        }
        #task-list li {
            background: #f8f9fa;
            padding: 10px;
            margin-bottom: 5px;
            border-left: 4px solid var(--accent-blue);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }
        .blink {
            animation: blinker 0.4s linear infinite;
            background-color: #ff3333 !important;
            color: white !important;
        }
        @keyframes blinker { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="header-bar" id="topHeader">
    <button class="cal-btn" onclick="openCalendarPlanner()">📅 Planner</button>
    <div style="font-weight: bold;" id="liveDateDisplay"></div>
</div>

<div class="container" id="appContainer">
    <div id="setupControls">
        <input type="text" id="taskName" placeholder="What work are you scheduling?">
        
        <div class="picker-container">
            <div class="time-scroll-box">
                <label>Hours</label>
                <select id="clockHrs"></select>
            </div>
            <div class="time-scroll-box">
                <label>Minutes</label>
                <select id="clockMins"></select>
            </div>
        </div>

        <button class="btn-main" onclick="addTask()">Add Task to Active Line</button>
        <button class="btn-main btn-start-timeline" id="startTimelineBtn" onclick="manuallyStartTimeline()">▶ Start Timeline</button>
    </div>

    <div id="current-timer-box">
        <div id="countdown-display">No timeline set. Put in your parameters above!</div>
    </div>

    <button class="btn-main btn-stop" id="stopAlarmBtn" onclick="stopAlarm()">STOP ALARM</button>

    <div style="text-align: left; font-weight: bold; margin-top: 15px;">Active Queue:</div>
    <ul id="task-list"></ul>
</div>

<div class="modal" id="calendarModal" onclick="closeCalendarPlanner(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3>📅 Schedule Scope Planner</h3>
        <div class="view-selectors">
            <button id="v-day" class="active" onclick="switchView('day')">1 Day</button>
            <button id="v-week" onclick="switchView('week')">1 Week</button>
            <button id="v-month" onclick="switchView('month')">1 Month</button>
            <button id="v-year" onclick="switchView('year')">1 Year</button>
        </div>
        
        <label style="font-weight: bold; font-size: 0.9rem;" id="scopeLabel">Select Targeting Date:</label>
        <input type="date" id="targetCalendarDate" style="width:100%; padding:8px; margin: 10px 0; border-radius:4px; border:1px solid #ccc;">
        
        <button class="btn-main" style="background: var(--bright-black); margin-top: 10px;" onclick="saveScopePlan()">Confirm Target Block</button>
        <button class="btn-main" style="background:#6c757d; margin-top:5px;" onclick="document.getElementById('calendarModal').style.display='none'">Close</button>
    </div>
</div>
<script>
    let taskQueue = [];
    let countdownInterval;
    let currentTask = null;
    let timeLeft = 0;
    let isTimelineRunning = false;
    let activeScope = 'day';
    let audioCtx = null;
    let beepInterval = null;

    window.onload = function() {
        const hrsSelect = document.getElementById('clockHrs');
        const minsSelect = document.getElementById('clockMins');
        
        for(let i=0; i<=12; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerHTML = i;
            hrsSelect.appendChild(opt);
        }
        for(let i=0; i<=60; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerHTML = i < 10 ? '0' + i : i;
            if(i === 25) opt.selected = true;
            minsSelect.appendChild(opt);
        }
        
        const options = { weekday: 'short', month: 'short', day: 'numeric' };
        document.getElementById('liveDateDisplay').innerText = new Date().toLocaleDateString('en-US', options);
        document.getElementById('targetCalendarDate').valueAsDate = new Date();
    }

    function openCalendarPlanner() {
        document.getElementById('calendarModal').style.display = 'flex';
    }

    function closeCalendarPlanner(e) {
        document.getElementById('calendarModal').style.display = 'none';
    }

    function switchView(type) {
        activeScope = type;
        document.querySelectorAll('.view-selectors button').forEach(b => b.classList.remove('active'));
        document.getElementById('v-' + type).classList.add('active');
        
        const label = document.getElementById('scopeLabel');
        const dateInput = document.getElementById('targetCalendarDate');
        
        if(type === 'day') { label.innerText = "Select Target Day:"; dateInput.type = "date"; }
        if(type === 'week') { label.innerText = "Select Starting Week Day:"; dateInput.type = "date"; }
        if(type === 'month') { label.innerText = "Select Target Month:"; dateInput.type = "month"; }
        if(type === 'year') { label.innerText = "Select Target Year:"; dateInput.type = "number"; dateInput.value = "2026"; }
    }

    function saveScopePlan() {
        const selectedVal = document.getElementById('targetCalendarDate').value;
        alert(`Timeline Locked: App layout configured for a 1-${activeScope} allocation schedule scope [Target: ${selectedVal}].`);
        document.getElementById('calendarModal').style.display = 'none';
    }

    function addTask() {
        const nameInput = document.getElementById('taskName');
        const hrs = parseInt(document.getElementById('clockHrs').value) || 0;
        const mins = parseInt(document.getElementById('clockMins').value) || 0;
        
        const name = nameInput.value.trim();
        const totalSeconds = (hrs * 3600) + (mins * 60);

        if (!name) { alert("Please input a name for this work step."); return; }
        if (totalSeconds <= 0) { alert("Please pick an hour or minute length greater than 0."); return; }

        taskQueue.push({ name: name, totalSeconds: totalSeconds, displayTime: `${hrs}h ${mins}m` });
        nameInput.value = '';
        updateQueueUI();

        // Prepare it quietly without auto-running the countdown
        if (!currentTask && !isTimelineRunning) { 
            prepareNextTimelineTask();
        }
    }

    function updateQueueUI() {
        const listUl = document.getElementById('task-list');
        listUl.innerHTML = '';
        taskQueue.forEach(task => {
            listUl.innerHTML += `<li><span>💼 ${task.name}</span> <span>⏱️ ${task.displayTime}</span></li>`;
        });
    }

    function prepareNextTimelineTask() {
        if (taskQueue.length === 0) {
            currentTask = null;
            document.getElementById('startTimelineBtn').style.display = 'none';
            document.getElementById('countdown-display').innerHTML = "All timeline slots processed! 🎉";
            return;
        }

        currentTask = taskQueue.shift();
        updateQueueUI();
        timeLeft = currentTask.totalSeconds;

        let h = Math.floor(timeLeft / 3600);
        let m = Math.floor((timeLeft % 3600) / 60);
        let s = timeLeft % 60;
        m = m < 10 ? '0' + m : m;
        s = s < 10 ? '0' + s : s;
        let displayStr = h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;

        document.getElementById('countdown-display').innerHTML = 
            `⏱️ <strong>Timeline Ready:</strong> ${currentTask.name}<br><span style="font-size: 2.2rem; font-weight:bold; color:#6c757d;">${displayStr}</span><br><small style="color:#6c757d;">Press "Start Timeline" manually when ready.</small>`;
        
        // Make the new Start Timeline button visible
        document.getElementById('startTimelineBtn').style.display = 'block';
    }

    function manuallyStartTimeline() {
        if (!currentTask) return;
        
        document.getElementById('startTimelineBtn').style.display = 'none';
        isTimelineRunning = true;
        
        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            let h = Math.floor(timeLeft / 3600);
            let m = Math.floor((timeLeft % 3600) / 60);
            let s = timeLeft % 60;
            
            m = m < 10 ? '0' + m : m;
            s = s < 10 ? '0' + s : s;
            let displayStr = h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;

            document.getElementById('countdown-display').innerHTML = 
                `⏳ <strong>Active Timeline Line:</strong> ${currentTask.name}<br><span style="font-size: 2.2rem; font-weight:bold; color:var(--accent-blue);">${displayStr}</span>`;

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                isTimelineRunning = false;
                triggerAlarm();
            }
            timeLeft--;
        }, 1000);
    }

    function triggerAlarm() {
        document.getElementById('setupControls').style.display = 'none';
        document.getElementById('topHeader').style.display = 'none';
        document.getElementById('stopAlarmBtn').style.display = 'block';
        document.getElementById('appContainer').classList.add('blink');
        
        document.getElementById('countdown-display').innerHTML = 
            `🚨 <strong>WORK TIMELINE COMPLETED!</strong><br><span style="font-size: 1.4rem;">Time up for: "${currentTask.name}"</span>`;

        if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        
        beepInterval = setInterval(() => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(950, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }, 450);
    }

    function stopAlarm() {
        clearInterval(beepInterval);
        document.getElementById('appContainer').classList.remove('blink');
        document.getElementById('stopAlarmBtn').style.display = 'none';
        document.getElementById('setupControls').style.display = 'block';
        document.getElementById('topHeader').style.display = 'flex';

        // Set up the next item and wait for manual button press
        prepareNextTimelineTask();
    }
</script>
</body>
</html>
